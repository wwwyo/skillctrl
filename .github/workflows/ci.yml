name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.12
      - name: Format, test, and vet
        run: |
          test -z "$(mise exec -- gofmt -l .)"
          mise exec -- go test -race ./...
          mise exec -- go vet ./...
      - name: Build release archives
        run: mise exec -- go run ./tools/release v0.0.0 dist
      - name: Smoke test native archive
        run: |
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) platform=linux_amd64 ;;
            Darwin/arm64) platform=darwin_arm64 ;;
            Darwin/x86_64) platform=darwin_amd64 ;;
            *) exit 1 ;;
          esac
          mkdir smoke
          tar -xzf "dist/skillctrl_0.0.0_${platform}.tar.gz" -C smoke
          test "$(smoke/skillctrl --version)" = 'skillctrl version v0.0.0'
          smoke/skillctrl check --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-${{ matrix.os }}
          path: dist/
          retention-days: 7

